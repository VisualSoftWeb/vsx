services:
  vsxai:
    build: .
    image: vsxai:latest
    container_name: vsxai
    restart: unless-stopped
    ports:
      - "3001:3001"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
